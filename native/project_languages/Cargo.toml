[package]
name = "qzx-project-languages-native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Tokei-backed project language analysis for QZX"

[lib]
name = "_project_languages_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py311"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokei = { version = "15.0.0", default-features = false }
