name: Compatibility report
description: Share reproducible evidence from an operating system or architecture.
title: "[Compatibility]: "
labels:
  - compatibility
body:
  - type: input
    id: version
    attributes:
      label: QZX version
      placeholder: 0.2.2.0.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Exact environment
      description: OS edition and version, exact Python implementation/version/build, architecture, shell, and relevant dependencies. State whether CPython is a standard or free-threaded build.
      placeholder: Ubuntu 24.04, standard CPython 3.13.12, Bash 5.2, x86_64
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command and arguments
      description: Redact private paths, names, and values.
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Worked as documented
        - Worked with a limitation
        - Failed
        - Could not complete the test
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction and evidence
      description: Include exit code and sanitized human/JSON output when safe.
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Limitations
      description: Permissions, optional dependencies, virtualization, untested branches, or other caveats.
