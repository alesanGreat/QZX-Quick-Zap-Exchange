# Keep executable GitHub Actions current while preserving immutable SHA pins.
# QZX runtime dependencies still live in setup.py, which GitHub's pip updater
# does not treat as a supported manifest; do not add a root pip entry that would
# imply false coverage. The isolated Python SDK example below has its own
# supported pip-compile manifest and hash-checked lock.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      artifact-actions:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
      vm-actions:
        patterns:
          - "vmactions/*"
  - package-ecosystem: "npm"
    directory: "/examples/result_contract/mcp-typescript-sdk-v2"
    schedule:
      interval: "weekly"
    groups:
      mcp-typescript-sdk:
        patterns:
          - "@modelcontextprotocol/*"
          - "zod"
  - package-ecosystem: "pip"
    directory: "/examples/result_contract/mcp-python-sdk-v2"
    schedule:
      interval: "weekly"
    groups:
      mcp-python-sdk:
        patterns:
          - "mcp"
          - "mcp-types"
  - package-ecosystem: "gomod"
    directory: "/examples/result_contract/mcp-go-sdk-v1"
    schedule:
      interval: "weekly"
    groups:
      mcp-go-sdk:
        patterns:
          - "github.com/modelcontextprotocol/go-sdk"
