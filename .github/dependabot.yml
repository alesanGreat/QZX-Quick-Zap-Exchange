# Keep executable GitHub Actions current while preserving immutable SHA pins.
# Python runtime dependencies still live in setup.py; GitHub's current pip
# updater does not treat that file as a supported manifest, so adding a pip
# entry here would imply coverage QZX does not actually have.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      artifact-actions:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
      vm-actions:
        patterns:
          - "vmactions/*"
