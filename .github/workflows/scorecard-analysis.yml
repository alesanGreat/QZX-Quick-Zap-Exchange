name: OpenSSF Scorecard analysis

on:
  push:
    branches:
      - main
  schedule:
    # Weekly on Saturdays at 01:30 UTC.
    - cron: "30 1 * * 6"

# Scorecard needs repository-wide read access to evaluate public project
# practices. The two write capabilities remain scoped to this single job.
permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Read workflow metadata evaluated by Scorecard checks.
      actions: read
      # Check out and analyze the repository contents.
      contents: read
      # Publish the SARIF report to GitHub code scanning.
      security-events: write
      # Authenticate the public Scorecard result with GitHub OIDC.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssf-scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
