name: Build native wheels

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "native/project_languages/**"
      - "src/qzx/commands/development/_project_language_*.py"
      - "scripts/smoke_native_project_languages.py"
      - "setup.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/native-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-wheels:
    name: Native ABI3 wheel | ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-15-intel
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out QZX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install CPython 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Confirm Rust toolchain
        run: rustc --version

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.1

      - name: Build, audit, and smoke native wheel
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Preserve native wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qzx-native-wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
