name: Cross-platform tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: QZX static correctness | CPython 3.13
    runs-on: ubuntu-24.04
    steps:
      - name: Check out QZX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install standard CPython 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install static, dependency, and distribution auditors
        run: >-
          python -m pip install
          ruff==0.16.0
          pip-audit==2.10.1
          build==1.3.0
          twine==6.2.0

      - name: Reject undefined names and invalid Python syntax
        run: python -m ruff check src tests

      - name: Install the QZX runtime dependency set in isolation
        run: python -m pip install --target "$RUNNER_TEMP/qzx-audit" .

      - name: Exclude the unreleased QZX package from the dependency audit
        shell: python
        run: |
          import os
          import shutil
          from pathlib import Path

          audit_root = Path(os.environ["RUNNER_TEMP"]) / "qzx-audit"
          shutil.rmtree(audit_root / "qzx")
          for metadata_directory in audit_root.glob("qzx-*.dist-info"):
              shutil.rmtree(metadata_directory)

      - name: Reject runtime dependencies with known vulnerabilities
        run: >-
          python -m pip_audit
          --path "$RUNNER_TEMP/qzx-audit"
          --strict
          --progress-spinner off

      - name: Build release-shaped artifacts on a POSIX filesystem
        run: python -m build --outdir "$RUNNER_TEMP/qzx-dist"

      - name: Verify metadata, attribution, hashes, and launcher mode
        run: >-
          python scripts/verify_distribution_artifacts.py
          --dist-dir "$RUNNER_TEMP/qzx-dist"
          --json

      - name: Validate package rendering for PyPI
        run: python -m twine check "$RUNNER_TEMP"/qzx-dist/*

  result-contract-conformance-action:
    name: Result Contract Composite Action smoke | CPython 3.13
    runs-on: ubuntu-24.04
    steps:
      - name: Check out QZX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate core evidence through the public Composite Action
        uses: ./.github/actions/result-contract-conformance
        with:
          profile: core
          success: examples/result_contract/valid-success.json
          failure: examples/result_contract/valid-failure.json
          report: qzx-core-conformance.json

      - name: Validate MCP 2025-11-25 structural evidence through the public Composite Action
        uses: ./.github/actions/result-contract-conformance
        with:
          profile: mcp-2025-11-25
          success: examples/result_contract/mcp-2025-success.json
          failure: examples/result_contract/mcp-2025-failure.json
          tool-definition: examples/result_contract/mcp-structural-tool-definition.json
          report: qzx-mcp-2025-conformance.json

      - name: Validate MCP 2026-07-28 evidence through the public Composite Action
        uses: ./.github/actions/result-contract-conformance
        with:
          profile: mcp-2026-07-28
          success: examples/result_contract/mcp-success.json
          failure: examples/result_contract/mcp-failure.json
          tool-definition: examples/result_contract/mcp-tool-definition.json
          report: qzx-mcp-2026-conformance.json

      - name: Verify generated receipts
        shell: python
        run: |
          import json
          from pathlib import Path

          expected = {
              "qzx-core-conformance.json": ("core", None),
              "qzx-mcp-2025-conformance.json": ("mcp-2025-11-25", "structural_core"),
              "qzx-mcp-2026-conformance.json": ("mcp-2026-07-28", "canonical_ref"),
          }
          for filename, (profile, output_schema_mode) in expected.items():
              report = json.loads(Path(filename).read_text(encoding="utf-8"))
              assert report["success"] is True, report
              assert report["details"]["profile"] == profile, report
              assert all(case["conformant"] for case in report["details"]["cases"]), report
              if output_schema_mode is not None:
                  modes = {
                      case["profile_facts"].get("output_schema_mode")
                      for case in report["details"]["cases"]
                  }
                  assert modes == {output_schema_mode}, report

  python:
    name: >-
      QZX test suite | ${{ matrix.platform.name }} |
      CPython ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
        platform:
          - name: Windows Server 2025 x64
            runner: windows-2025
            python_architecture: x64
            expected_system: Windows
            expected_version_prefix: "10.0.26100"
            expected_machines: AMD64
            pointer_bits: 64
          - name: Windows Server 2025 x64 with x86 CPython
            runner: windows-2025
            python_architecture: x86
            expected_system: Windows
            expected_version_prefix: "10.0.26100"
            expected_machines: AMD64,x86
            pointer_bits: 32
          - name: Windows Server 2022 x64
            runner: windows-2022
            python_architecture: x64
            expected_system: Windows
            expected_version_prefix: "10.0.20348"
            expected_machines: AMD64
            pointer_bits: 64
          - name: Windows 11 Enterprise ARM64
            runner: windows-11-arm
            python_architecture: arm64
            expected_system: Windows
            expected_version_prefix: "10.0.26200"
            expected_machines: ARM64
            pointer_bits: 64
          - name: Ubuntu 24.04 x64
            runner: ubuntu-24.04
            python_architecture: x64
            expected_system: Linux
            expected_version_prefix: "24.04"
            expected_machines: x86_64
            pointer_bits: 64
          - name: Ubuntu 24.04 ARM64
            runner: ubuntu-24.04-arm
            python_architecture: arm64
            expected_system: Linux
            expected_version_prefix: "24.04"
            expected_machines: aarch64,arm64
            pointer_bits: 64
          - name: Ubuntu 22.04 x64
            runner: ubuntu-22.04
            python_architecture: x64
            expected_system: Linux
            expected_version_prefix: "22.04"
            expected_machines: x86_64
            pointer_bits: 64
          - name: macOS 26 ARM64
            runner: macos-26
            python_architecture: arm64
            expected_system: Darwin
            expected_version_prefix: "26."
            expected_machines: arm64
            pointer_bits: 64
          - name: macOS 15 ARM64
            runner: macos-15
            python_architecture: arm64
            expected_system: Darwin
            expected_version_prefix: "15."
            expected_machines: arm64
            pointer_bits: 64
          - name: macOS 15 Intel
            runner: macos-15-intel
            python_architecture: x64
            expected_system: Darwin
            expected_version_prefix: "15."
            expected_machines: x86_64
            pointer_bits: 64
    runs-on: ${{ matrix.platform.runner }}
    env:
      QZX_TELEMETRY: "0"
    steps:
      - name: Check out QZX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install standard CPython ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.platform.python_architecture }}
          cache: pip

      - name: Verify real operating system, architecture, and Python build
        shell: python
        env:
          EXPECTED_SYSTEM: ${{ matrix.platform.expected_system }}
          EXPECTED_VERSION_PREFIX: ${{ matrix.platform.expected_version_prefix }}
          EXPECTED_MACHINES: ${{ matrix.platform.expected_machines }}
          EXPECTED_POINTER_BITS: ${{ matrix.platform.pointer_bits }}
        run: |
          import json
          import os
          import platform
          import struct
          import sysconfig

          system = platform.system()
          machine = platform.machine()
          pointer_bits = struct.calcsize("P") * 8

          if system == "Linux":
              os_release = {}
              with open("/etc/os-release", encoding="utf-8") as handle:
                  for line in handle:
                      key, separator, value = line.rstrip().partition("=")
                      if separator:
                          os_release[key] = value.strip('"')
              os_version = os_release.get("VERSION_ID", "")
          elif system == "Darwin":
              os_version = platform.mac_ver()[0]
          elif system == "Windows":
              os_version = platform.version()
          else:
              raise AssertionError("Unexpected operating system: {}".format(system))

          expected_machines = {
              value.casefold()
              for value in os.environ["EXPECTED_MACHINES"].split(",")
          }
          evidence = {
              "system": system,
              "os_version": os_version,
              "machine": machine,
              "pointer_bits": pointer_bits,
              "python_implementation": platform.python_implementation(),
              "python_version": platform.python_version(),
              "gil_disabled": sysconfig.get_config_var("Py_GIL_DISABLED"),
          }
          print(json.dumps(evidence, indent=2, sort_keys=True))

          assert system == os.environ["EXPECTED_SYSTEM"]
          assert os_version.startswith(os.environ["EXPECTED_VERSION_PREFIX"])
          assert machine.casefold() in expected_machines
          assert pointer_bits == int(os.environ["EXPECTED_POINTER_BITS"])
          assert platform.python_implementation() == "CPython"
          assert platform.python_version().startswith("3.13.")
          assert sysconfig.get_config_var("Py_GIL_DISABLED") != 1

      - name: Install QZX and tests
        run: python -m pip install --upgrade pip pytest -e .

      - name: Smoke test QZX in PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m qzx version --json

      - name: Smoke test QZX in Command Prompt
        if: runner.os == 'Windows'
        shell: cmd
        run: python -m qzx version --json

      - name: Run real system integration
        run: >-
          python -m pytest -q
          tests/integration/test_real_system_dependencies.py

      - name: Run remaining QZX test suite
        run: >-
          python -m pytest -q
          --ignore=tests/integration/test_real_system_dependencies.py

      - name: Capture sanitized Golden Core platform evidence
        run: >-
          python scripts/capture_golden_core_platform_evidence.py
          --output "${{ runner.temp }}/golden-core-platform-evidence.json"
          --environment-id "${{ matrix.platform.runner }}-${{ matrix.platform.python_architecture }}"
          --environment-name "${{ matrix.platform.name }}"

      - name: Upload Golden Core platform evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-core-platform-${{ matrix.platform.runner }}-${{ matrix.platform.python_architecture }}
          path: ${{ runner.temp }}/golden-core-platform-evidence.json
          if-no-files-found: error
          retention-days: 90

  golden-core-platform-evidence:
    name: QZX Golden Core platform evidence summary
    needs: python
    runs-on: ubuntu-24.04
    steps:
      - name: Check out QZX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install standard CPython 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Download every matrix evidence record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: golden-core-platform-*
          path: ${{ runner.temp }}/golden-core-platform-records

      - name: Validate and merge the matrix evidence
        run: >-
          python scripts/merge_golden_core_platform_evidence.py
          "${{ runner.temp }}/golden-core-platform-records"
          --output "${{ runner.temp }}/golden-core-platform-summary.json"

      - name: Publish the validated evidence summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-core-platform-evidence-summary
          path: ${{ runner.temp }}/golden-core-platform-summary.json
          if-no-files-found: error
          retention-days: 90
