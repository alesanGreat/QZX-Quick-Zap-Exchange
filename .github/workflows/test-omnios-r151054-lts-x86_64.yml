name: QZX tests | OmniOS r151054 LTS x86_64 | CPython 3.13

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-omnios-r151054-lts-x86-64:
    name: QZX test suite | OmniOS r151054 LTS x86_64 | CPython 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QZX_TELEMETRY: "0"
    steps:
      - name: Check out QZX | OmniOS r151054 LTS x86_64
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Start VM | OmniOS r151054 LTS x86_64
        id: start-omnios-r151054-lts-x86-64
        uses: vmactions/omnios-vm@027e3ec08fed6fb740ab5f300c2605f9de02997a # v1.3.4
        with:
          # r151054-build is the r151054 LTS image with its build toolchain.
          release: "r151054-build"
          arch: x86_64
          usesh: true
          sync: rsync
          copyback: false
          custom-shell-name: omnios-r151054-lts-x86-64
          envs: QZX_TELEMETRY
          cache-after-prepare: true
          prepare: |
            set -eu
            pkg install developer/versioning/git runtime/python-313 || {
              status=$?
              test "$status" -eq 4
            }
            curl -fsSLo /tmp/get-pip.py \
              https://raw.githubusercontent.com/pypa/get-pip/3b73145063be545b649ad9ca83ea8da5fc915a4f/public/get-pip.py
            python3.13 /tmp/get-pip.py --break-system-packages
            rm /tmp/get-pip.py

      - name: Verify platform | OmniOS r151054 LTS x86_64
        shell: omnios-r151054-lts-x86-64 {0}
        run: |
          set -eu
          kernel_release="$(uname -v)"
          kernel_arch="$(isainfo -k)"
          cat /etc/release
          printf 'OmniOS kernel release: %s\nKernel architecture: %s\n' \
            "$kernel_release" "$kernel_arch"
          case "$kernel_release" in
            omnios-r151054-*) ;;
            *)
              printf 'Expected OmniOS r151054 LTS, got %s\n' \
                "$kernel_release" >&2
              exit 1
              ;;
          esac
          test "$kernel_arch" = "amd64"
          python3.13 - <<'PY'
          import platform
          import sysconfig

          print(f"Python: {platform.python_implementation()} {platform.python_version()}")
          assert platform.python_implementation() == "CPython"
          assert platform.python_version().startswith("3.13.")
          assert sysconfig.get_config_var("Py_GIL_DISABLED") != 1
          PY

      - name: Install QZX and tests | OmniOS r151054 LTS x86_64
        shell: omnios-r151054-lts-x86-64 {0}
        run: >-
          python3.13 -m pip install --break-system-packages pytest -e .

      - name: Run real system integration | OmniOS r151054 LTS x86_64
        shell: omnios-r151054-lts-x86-64 {0}
        run: >-
          python3.13 -m pytest -q
          tests/integration/test_real_system_dependencies.py

      - name: Run remaining QZX test suite | OmniOS r151054 LTS x86_64
        shell: omnios-r151054-lts-x86-64 {0}
        run: >-
          python3.13 -m pytest -q
          --ignore=tests/integration/test_real_system_dependencies.py
